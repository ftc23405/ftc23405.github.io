<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Crash Out! team mark">
  <title>Crash Out! — FTC 23405</title>
  <defs>
    <!-- Left-to-right pink → coral → amber, matching the team logo -->
    <linearGradient id="crashOutGrad" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#ef4a9b"/>
      <stop offset="50%"  stop-color="#f5a17e"/>
      <stop offset="100%" stop-color="#f8dc57"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="45" fill="url(#crashOutGrad)" stroke="#121014" stroke-width="4.5"/>

  <!-- Three lightning bolts, small / large / medium, as on the team logo -->
  <g fill="#121014">
    <path d="M31 30 L21 53 h7.5 l-4.5 17 15.5-25 h-7.5 z"/>
    <path d="M53 17 L38 51 h9.5 l-5.5 24 20-32 h-9.5 z"/>
    <path d="M74 37 L66.5 54 h5.5 l-3.5 13 11.5-19 h-6 z"/>
  </g>
</svg>
